# -----------------------------------------------------------------------------
# Business-rule parameters for the Credit Assessment Engine.
#
# These are SEED values. On application startup any key below that does not yet
# exist in the `config_parameters` table is inserted. Existing rows are left
# untouched, so operational edits (via the DB or a future admin screen) win.
#
# >>> ALL NUMBERS HERE ARE FICTIONAL PLACEHOLDERS FOR DEMONSTRATION ONLY. <<<
# They are not derived from, and must not be read as, any real consumer-credit
# policy or regulation in Kuwait or anywhere else.
# -----------------------------------------------------------------------------
parameters:
  minimum_monthly_income:
    value: 300
    type: float
    description: >
      FICTIONAL PLACEHOLDER. Applicant monthly income below this value fails
      assessment outright (decision = rejected).

  maximum_debt_burden_ratio:
    value: 0.40
    type: float
    description: >
      FICTIONAL PLACEHOLDER. Maximum allowed
      (existing_monthly_obligations + estimated_installment) / monthly_income.
      Breaching it routes the application to manual review (decision = referred).

  installment_estimation_factor:
    value: 1.0
    type: float
    description: >
      FICTIONAL PLACEHOLDER. Until the installment-sale pricing methodology is
      decided, the monthly installment is estimated as
      (requested_amount * factor) / requested_tenor_months. A factor of 1.0 means
      a plain straight-line split of the requested amount with no profit/markup.

  risk_score_auto_approve_min:
    value: 650
    type: int
    description: >
      FICTIONAL PLACEHOLDER. Customer risk_score at or above this is eligible for
      auto-approval (subject to the income and DBR rules also passing).

  risk_score_refer_min:
    value: 600
    type: int
    description: >
      FICTIONAL PLACEHOLDER. Customer risk_score at or above this but below
      risk_score_auto_approve_min is routed to manual review (decision = referred).
      Below this value the application is rejected.

  # ---------------------------------------------------------------------------
  # Step 2 — Installment pricing / profit engine
  # ---------------------------------------------------------------------------
  tenor_profit_rate_table:
    type: json
    value:
      "6": 0.04
      "12": 0.09
      "18": 0.135
      "24": 0.18
      "36": 0.30
    description: >
      FICTIONAL PLACEHOLDER. Maps tenor (whole months, as string keys) to the
      TOTAL profit rate applied over the life of the plan, charged on the
      financed principal (cash_price - down_payment). These are invented demo
      numbers, not real commercial installment rates. A requested tenor with no
      entry here is rejected at offer generation.

  minimum_down_payment_pct:
    value: 0.15
    type: float
    description: >
      FICTIONAL PLACEHOLDER. Minimum down payment as a fraction of the product
      cash price. An offer request below this is rejected.

  offer_validity_days:
    value: 7
    type: int
    description: >
      FICTIONAL PLACEHOLDER. Number of days a presented offer remains acceptable
      before it is treated as expired.

  # ---------------------------------------------------------------------------
  # Step 3 — payments, overdue detection, late fees
  # ---------------------------------------------------------------------------
  late_fee_rate:
    value: 0.02
    type: float
    description: >
      CONFIRMED BUSINESS RULE (not a placeholder): a late fee is 2% of the
      overdue installment's own total (principal_component + profit_component).
      Exposed as config for operability, but the agreed value is 0.02.

  late_fee_grace_period_days:
    value: 10
    type: int
    description: >
      PLACEHOLDER — open decision. Days past an installment's due date before a
      late fee may be assessed. A fee is created only when DPD > this value.

  late_fee_once_per_installment:
    value: true
    type: bool
    description: >
      PLACEHOLDER — open decision. When true (the Step 3 default), at most one
      late fee is ever assessed per installment. Recurring re-charging while an
      installment stays overdue is intentionally NOT implemented yet.

  late_fee_max_per_contract:
    value: 0
    type: float
    description: >
      PLACEHOLDER — NOT WIRED UP. Intended future cap on total late fees per
      contract. A value of 0 means "no cap". Step 3 does not read or enforce
      this; it exists so the parameter name is reserved.

  # ---------------------------------------------------------------------------
  # Step 4 — contract closure: early settlement, cancellation, return
  # Every value here is a FICTIONAL PLACEHOLDER. None of these represents a
  # confirmed commercial or legal policy; they exist so the formulas are
  # config-driven and swappable.
  # ---------------------------------------------------------------------------
  early_settlement_profit_rebate_pct:
    value: 0.5
    type: float
    description: >
      PLACEHOLDER — NOT CONFIRMED POLICY. Fraction of the remaining unearned
      profit that is WAIVED when a customer settles early. 0.5 = half waived,
      half still charged. profit_rebate_amount = unearned_profit_balance * this.

  down_payment_refund_pct_cancellation:
    value: 1.0
    type: float
    description: >
      PLACEHOLDER — NOT CONFIRMED POLICY. Fraction of the down payment refunded
      when a contract is cancelled BEFORE delivery. 1.0 = full refund.

  down_payment_refund_pct_return:
    value: 0.0
    type: float
    description: >
      PLACEHOLDER — NOT CONFIRMED POLICY. Fraction of the down payment refunded
      when a delivered contract is returned. 0.0 = no down-payment refund.

  ownership_transfers_on_delivery:
    value: true
    type: bool
    description: >
      PLACEHOLDER — NOT A LEGAL POSITION. Assumption about whether product
      ownership passes to the customer at delivery. No logic branches on this
      yet; it is only echoed back in the return response so the assumption in
      effect is visible.

  settlement_quote_validity_days:
    value: 3
    type: int
    description: >
      PLACEHOLDER. Days a generated settlement quote is considered valid. The
      /settle endpoint always regenerates and re-compares the payoff amount, so
      this is informational (surfaced as quote_expiry).
