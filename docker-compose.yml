services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: retail
      POSTGRES_PASSWORD: retail
      POSTGRES_DB: retail_credit
    ports:
      # host 5544 -> container 5432 (host 5432/5433 are taken by other projects)
      - "5544:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U retail -d retail_credit"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://retail:retail@db:5432/retail_credit
      BUSINESS_RULES_FILE: config/business_rules.yaml
      # Step 5 auth — override in any real deployment.
      JWT_SECRET_KEY: dev-insecure-secret-change-me
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: admin
    ports:
      - "8000:8000"
    # Run migrations, then serve. Config params + bootstrap admin are seeded on startup.
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

volumes:
  pgdata:
